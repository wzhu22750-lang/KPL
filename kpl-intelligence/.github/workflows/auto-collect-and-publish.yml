name: Auto Collect & Publish KPL Intelligence

on:
  schedule:
    # 每天 08:00 - 24:00 (北京时间，即 UTC 00:00 - 16:00)，每 2 小时自动抓取一次
    - cron: '0 0-16/2 * * *'
  workflow_dispatch: # 支持在 GitHub 网页界面上手动一键立即触发

jobs:
  collect-and-publish:
    name: Fetch & Publish News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Collection (抓取最新资讯)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'true'
          DAJIALA_KEY: ${{ secrets.DAJIALA_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "📡 开始执行全量信源抓取..."
          npm run collect:all

      - name: Run Editorial & Publish (AI 分析与发布)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_CALLS_ENABLED: 'true'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "🤖 开始执行 AI 内容分析与时间线发布..."
          npm run publish:all || true
