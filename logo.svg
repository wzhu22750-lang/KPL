<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Color palette -->
    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B6DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for tech feel -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- K letterform with data stream integration -->
  <g id="mark">
    <!-- Vertical stem of K -->
    <rect x="20" y="40" width="12" height="120" fill="#FAFAFA" rx="2"/>
    
    <!-- Upper diagonal - data stream bars ascending -->
    <path d="M 32 85 L 75 50 L 82 55 L 90 48 L 97 52 L 105 45 L 112 50 L 120 40" 
          stroke="url(#dataFlow)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"
          filter="url(#glow)"/>
    
    <!-- Lower diagonal - continuation of data flow -->
    <path d="M 32 95 L 60 115 L 68 125 L 76 133 L 85 143 L 95 153 L 105 160" 
          stroke="url(#dataFlow)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"
          filter="url(#glow)"/>
    
    <!-- Geometric accent - intelligence indicator -->
    <circle cx="110" cy="40" r="6" fill="#38BDF8" opacity="0.8"/>
    <circle cx="110" cy="40" r="3" fill="#FAFAFA"/>
  </g>
  
  <!-- Wordmark: KPL Intelligence -->
  <g id="wordmark">
    <!-- KPL in bold -->
    <text x="150" y="115" 
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="700" 
          letter-spacing="-0.02em"
          fill="#FAFAFA">KPL</text>
    
    <!-- Intelligence in lighter weight -->
    <text x="295" y="115" 
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="300" 
          letter-spacing="-0.01em"
          fill="#A1A9B8">Intelligence</text>
  </g>
  
  <!-- Subtle data visualization accent below wordmark -->
  <g opacity="0.4">
    <rect x="150" y="135" width="28" height="3" fill="#38BDF8" rx="1.5"/>
    <rect x="182" y="135" width="16" height="3" fill="#3B6DFF" rx="1.5"/>
    <rect x="202" y="135" width="22" height="3" fill="#38BDF8" rx="1.5"/>
  </g>
</svg>