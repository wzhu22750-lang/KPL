<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B6DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="32" height="32" fill="#0A0E1A" rx="6"/>
  
  <!-- Simplified K mark for small size -->
  <g transform="translate(6, 4)">
    <!-- Vertical stem -->
    <rect x="2" y="4" width="3" height="16" fill="#F0F3F7" rx="0.5"/>
    
    <!-- Upper diagonal -->
    <path d="M 5 11 L 10 7 L 14 9 L 17 6" 
          stroke="url(#faviconFlow)" 
          stroke-width="3" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Lower diagonal -->
    <path d="M 5 13 L 10 17 L 14 20" 
          stroke="url(#faviconFlow)" 
          stroke-width="3" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Intelligence dot -->
    <circle cx="17" cy="6" r="1.5" fill="#38BDF8"/>
  </g>
</svg>