name: Auto Collect & Publish KPL Intelligence

# 自动化保鲜流水线：定时抓取最新信源 + AI 智能清洗、打分并推送到线上时间线
on:
  schedule:
    # 比赛黄金时段 (北京时间 14:00 - 22:00，即 UTC 06:00 - 14:00)：每 20 分钟高频抓取一次
    - cron: '*/20 6-14 * * *'
    # 其余时间 (北京时间 22:00 - 次日 14:00，即 UTC 16:00 - 04:00 偶数点)：每 2 小时抓取一次
    - cron: '0 0,2,4,16,18,20,22 * * *'
  workflow_dispatch: # 支持在 GitHub 网页界面上手动一键立即触发

jobs:
  collect-and-publish:
    name: Fetch & Publish News
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'kpl-intelligence/package-lock.json'

      - name: Install Dependencies
        working-directory: kpl-intelligence
        run: npm ci

      - name: Run Collection (抓取最新资讯)
        working-directory: kpl-intelligence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'true'
          DAJIALA_KEY: ${{ secrets.DAJIALA_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "📡 开始执行全量信源抓取..."
          npm run collect:all

      - name: Run Editorial & Publish (AI 分析与发布)
        working-directory: kpl-intelligence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_CALLS_ENABLED: 'true'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "🤖 开始执行 AI 内容分析与时间线发布..."
          npm run publish:all || true
