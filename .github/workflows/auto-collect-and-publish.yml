name: Auto Collect & Publish KPL Intelligence

# 自动化保鲜流水线：定时抓取最新信源 + AI 智能清洗、打分并推送到线上时间线
on:
  schedule:
    # 每天 08:00 - 24:00 (北京时间，即 UTC 00:00 - 16:00)，每 2 小时自动抓取一次
    - cron: '0 0-16/2 * * *'
  workflow_dispatch: # 支持在 GitHub 网页界面上手动一键立即触发

jobs:
  collect-and-publish:
    name: Fetch & Publish News
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'kpl-intelligence/package-lock.json'

      - name: Install Dependencies
        working-directory: kpl-intelligence
        run: npm ci

      - name: Run Collection (抓取最新资讯)
        working-directory: kpl-intelligence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_ENABLED: 'true'
          MODEL_CALLS_ENABLED: 'true'
          DAJIALA_API_KEY: ${{ secrets.DAJIALA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "📡 开始执行全量信源抓取..."
          npm run collect:all

      - name: Run Editorial & Publish (AI 分析与发布)
        working-directory: kpl-intelligence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_CALLS_ENABLED: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          echo "🤖 开始执行 AI 内容分析与时间线发布..."
          npm run publish:all || true
